name: "Integration"
on:
  workflow_dispatch:
    inputs:
      stacks:
        description: "Stacks to test (comma-separated) or 'all' (default: affected stacks)"
        type: string
        required: false
  push:
    branches:
      - main
  pull_request:

jobs:
  detect:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tests: ${{ steps.affected.outputs.tests }}
    steps:
      - uses: actions/checkout@v7
      - name: Filter changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          list-files: json
          filters: |
            stacks:
              - 'modules/**'
            template:
              - 'template/**'
            scaffolding:
              - 'tests/**'
              - 'lib/**'
              - 'flake.nix'
      - name: Determine affected tests
        id: affected
        env:
          STACK_FILES: ${{ steps.filter.outputs.stacks_files }}
          TEMPLATE_CHANGED: ${{ steps.filter.outputs.template }}
          SCAFFOLDING_CHANGED: ${{ steps.filter.outputs.scaffolding }}
          MANUAL_STACKS: ${{ inputs.stacks }}
        run: |
          set -euo pipefail

          if [[ -n "$MANUAL_STACKS" ]]; then
            if [[ "$MANUAL_STACKS" == "all" ]]; then
              STACKS=$( { for f in modules/*/vm-tests/default.nix; do [[ -e "$f" ]] && printf '%s\n' "$f" | cut -d/ -f2; done; echo template; } )
            else
              STACKS=$(echo "$MANUAL_STACKS" | tr ',' '\n')
            fi
          else
            STACKS=$(echo "$STACK_FILES" | jq -r '.[]' | grep '^modules/' | cut -d/ -f2 | sort -u || true)
            # Shared test scaffolding affects every stack, smoke-test the cheapest one.
            if [[ "$SCAFFOLDING_CHANGED" == "true" && -z "$STACKS" ]]; then
              STACKS="it-tools"
            fi
            # The template config exercises the whole stack cross-wiring.
            if [[ "$TEMPLATE_CHANGED" == "true" && -z "$STACKS" ]]; then
              STACKS="template"
            fi
          fi

          TESTS=()
          for s in $STACKS; do
            if [[ "$s" == "template" ]]; then
              TESTS+=("template-integration")
              continue
            fi
            [[ -f "modules/$s/vm-tests/default.nix" ]] || continue
            TESTS+=("$s-integration")
            for f in "modules/$s/vm-tests"/*.nix; do
              [[ -e "$f" ]] || continue
              n=$(basename "$f" .nix)
              if [[ "$n" != "default" ]]; then
                TESTS+=("$s-$n-integration")
              fi
            done
          done

          TESTS_JSON=$(printf '%s\n' "${TESTS[@]}" | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "tests=$TESTS_JSON" >> "$GITHUB_OUTPUT"

  integration:
    needs: detect
    if: needs.detect.outputs.tests != '[]'
    runs-on: ubuntu-26.04
    name: Integration (${{ matrix.tests }})
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.tests }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        tests: ${{ fromJson(needs.detect.outputs.tests) }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: "experimental-features = nix-command flakes pipe-operators"
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1073741824
          purge: false
      - name: Run integration test
        env:
          TEST: ${{ matrix.tests }}
        run: nix build ".#integrationTests.x86_64-linux.$TEST" --no-link --option sandbox false -L

  # Single, stable check for branch protection. The matrix job itself cannot be
  # required: its entries are dynamic and a skipped matrix job counts as a pass.
  # Re-run all failed jobs together; a partial re-run can mask a failed matrix leg.
  integration-results:
    name: Integration Results
    needs: [detect, integration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check integration results
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          MATRIX_RESULT: ${{ needs.integration.result }}
          TESTS: ${{ needs.detect.outputs.tests }}
        run: |
          set -euo pipefail

          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "::error::Test detection did not succeed ($DETECT_RESULT)."
            exit 1
          fi

          # An empty matrix skips the integration job, which is not a failure.
          if [[ "$TESTS" == "[]" ]]; then
            echo "No affected integration tests; nothing to check."
            exit 0
          fi

          if [[ "$MATRIX_RESULT" != "success" ]]; then
            echo "::error::One or more integration tests did not succeed ($MATRIX_RESULT)."
            exit 1
          fi

          echo "All integration tests passed."
