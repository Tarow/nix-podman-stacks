name: "Update Template"
on:
  release:
    types: [published]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-template
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-26.04
    steps:
      - name: Generate App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app_token.outputs.token }}
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes pipe-operators"
      - name: Check for a newer release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flake_repo=$(sed -nE 's|.*github:([^/"]+/nix-podman-stacks)/[^"]*".*|\1|p' template/flake.nix)
          current=$(sed -nE 's|.*github:[^/"]+/nix-podman-stacks/([^"]*)".*|\1|p' template/flake.nix)
          if [[ -z "$flake_repo" || -z "$current" ]]; then
            echo "Could not read the nix-podman-stacks pin from template/flake.nix" >&2
            exit 1
          fi
          latest=$(gh api "repos/$flake_repo/releases/latest" --jq .tag_name 2>/dev/null) || latest=""
          changed=false
          if [[ -z "$latest" ]]; then
            echo "No published release found for $flake_repo, skipping." >&2
          elif [[ "$current" == "$latest" ]]; then
            echo "Template is already on $current, nothing to do." >&2
          else
            echo "Updating $current -> $latest" >&2
            changed=true
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Bump pin, refresh lock, verify
        if: steps.release.outputs.changed == 'true'
        env:
          TAG: ${{ steps.release.outputs.latest }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9A-Za-z][0-9A-Za-z.+-]*$ ]] || { echo "Unexpected release tag '$TAG'" >&2; exit 1; }
          sed -i -E "s|(github:[^\"]+/nix-podman-stacks/)[^\"]+|\1$TAG|" template/flake.nix
          test "$(git diff --numstat -- template/flake.nix | cut -f2)" -eq 1
          test "$(sed -nE 's|.*github:[^/"]+/nix-podman-stacks/([^"]*)".*|\1|p' template/flake.nix)" = "$TAG"
          nix flake lock ./template
          nix build ./template#homeConfigurations.myhost.activationPackage
      - name: Commit
        if: steps.release.outputs.changed == 'true'
        env:
          TAG: ${{ steps.release.outputs.latest }}
        run: |
          set -euo pipefail
          git config --global user.name "Tarow[bot]"
          git config --global user.email "195547385+tarow[bot]@users.noreply.github.com"
          git add template/flake.nix
          git diff --cached --quiet || git commit -m "chore(deps): update template nix-podman-stacks to $TAG"
          git push
